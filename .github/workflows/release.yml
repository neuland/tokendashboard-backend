name: "Release: publish images and GitHub Release"
run-name: Release ${{ github.ref_name }}

# A release is a vX.Y.Z tag on a commit in main. This publishes both images to the GitHub
# Container Registry and creates the GitHub Release with the changelog section and a
# docker-compose.yml pinned to this version; see CHANGELOG.md and the README.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # the GitHub Release
  packages: write # the images

jobs:
  check:
    name: Check tag, versions and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME does not point to a commit in main"; exit 1; }

      # Backend and frontend share one version (CHANGELOG.md); the tag has to match both.
      - name: Tag matches the versions in the build files
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          backend=$(sed -nE 's/^version = "(.*)"$/\1/p' backend/build.gradle.kts)
          frontend=$(node -p "require('./frontend/package.json').version")
          echo "tag $version, backend/build.gradle.kts $backend, frontend/package.json $frontend"
          if [ "$backend" != "$version" ] || [ "$frontend" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the versions in backend/build.gradle.kts and frontend/package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Everything the GitHub Release needs is prepared and checked here, before any image
      # is pushed: a missing changelog section must not leave published images behind
      # without a release.
      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release/notes.md
          if ! grep -q '[^[:space:]]' release/notes.md; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi

      # The published docker-compose.yml runs the images of exactly this release. Both
      # image lines have to be replaced; if docker-compose.yml no longer matches the
      # pattern, sed changes nothing without failing, so the count catches it.
      - name: docker-compose.yml pinned to this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s/\${TOKENDASHBOARD_VERSION:-latest}/\${TOKENDASHBOARD_VERSION:-$VERSION}/" \
            docker-compose.yml > release/docker-compose.yml
          replaced=$(grep -c "TOKENDASHBOARD_VERSION:-$VERSION}" release/docker-compose.yml || true)
          if [ "$replaced" -ne 2 ]; then
            echo "::error::Expected 2 image lines with \${TOKENDASHBOARD_VERSION:-latest} in docker-compose.yml, replaced $replaced"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  images:
    name: Publish ${{ matrix.image }} image
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Both Dockerfiles build on the native platform and only assemble the runtime stage
      # per platform, so emulation is needed just for that short stage.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3, 1.2, 1 and latest; a pre-release tag (v1.2.3-rc.1) gets only its own tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    name: Create GitHub Release
    needs: [check, images]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # Prepared and checked by the check job.
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release/docker-compose.yml \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file release/notes.md "${prerelease[@]}"
