# The whole stack, to try it out in one go:
#
#   docker compose up      →  http://localhost:8088
#
# On its own this file runs the published images, so it works without the source code
# (each release attaches a copy pinned to its version). In a checkout, Compose also reads
# docker-compose.override.yml, which builds both images from the source instead;
# `docker compose -f docker-compose.yml up` skips it and runs the published images there too.
#
# Not for development: backend/docker-compose.yml starts only the database for that.
# Both can run side by side — nothing here is published except the frontend's port.
#
# Its own project name, so its containers and its volume (tokendashboard-stack_postgres_data)
# never clash with a development database: those use the names tokendashboard and
# tokendashboard-backend.
name: tokendashboard-stack

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tokendashboard
      POSTGRES_USER: tokendashboard
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-tokendashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokendashboard -d tokendashboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: ghcr.io/neuland/tokendashboard/backend:${TOKENDASHBOARD_VERSION:-latest}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tokendashboard
      DATABASE_USER: tokendashboard
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-tokendashboard}
      REPORTING_TIME_ZONE: ${REPORTING_TIME_ZONE:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/neuland/tokendashboard/frontend:${TOKENDASHBOARD_VERSION:-latest}
    ports:
      - "${TOKENDASHBOARD_PORT:-8088}:80"
    # Replaces the image's own nginx config: serves the static site and forwards /api to
    # the backend, which is what an ingress does in a real deployment. The image itself
    # stays unchanged.
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped

configs:
  nginx:
    # `$$` keeps nginx's variables away from Compose's own interpolation.
    content: |
      server {
          listen 80;
          root /usr/share/nginx/html;
          index index.html;
          # /provider/claude → /provider/claude/ as a relative redirect; an absolute one
          # would name the container's port 80 instead of the published one.
          absolute_redirect off;

          location /api/ {
              proxy_pass http://backend:8080;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              # The backend rejects ingest bodies above 8 MiB itself (IngestLimits.kt).
              client_max_body_size 8m;
          }

          location / {
              try_files $$uri $$uri/ =404;
          }
      }

volumes:
  postgres_data:
